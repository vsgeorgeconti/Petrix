<div class="min-h-60 flex flex-col gap-3 border p-4 border-amber-400">
    <div class="flex justify-between mt auto items-center p-4">
        <h2 class="text-4xl">Clientes</h2>
    </div>

    <div class="flex flex-1 mt-10 w-full flex-col items-center justify-center">
        <div class="w-full flex flex-col gap-10 border border-gray-300 rounded p-6">

            <div class="flex flex-col gap-5">
                @if(isEdit)
                {
                    <input type="text"
                           class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Nome">
                }
               @else
                {
                    <input type="text"
                           class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Nome">
                    <input type="text"
                           class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Documento">
                }
                <input type="text"
                       class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Email">
                <input type="text"
                       class="flex-1 px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="Telefone">
            </div>
        </div>
        <div class="flex flex-1 justify-between mt-10 gap-5 ">
            <button class="w-16 h-10 text-blue-100 border border-blue-600 rounded bg-blue-600 hover:bg-blue-500 transition-colors">Salvar</button>
            <button class="w-16 h-10 text-blue-100 border border-blue-600 rounded bg-blue-600 hover:bg-blue-500 transition-colors">Voltar</button>
        </div>
    </div>
</div>
